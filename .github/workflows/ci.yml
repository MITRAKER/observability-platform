# Continuous Integration: runs on every pull request and every push to main.
# A PR can only be merged with confidence when every job here is green.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: jobs can only read the repository unless they ask for more.
permissions:
  contents: read

# A new push to the same PR cancels the old, now useless, run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  PROMETHEUS_IMAGE: prom/prometheus:v3.13.5
  ALERTMANAGER_IMAGE: prom/alertmanager:v0.29.0
  OTELCOL_IMAGE: otel/opentelemetry-collector-contrib:0.164.0

jobs:
  lint:
    name: Lint, format, types, Power of Ten
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff (lint + security rules)
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .
      - name: mypy --strict
        run: mypy services/gateway/main.py services/orders/main.py services/payments/main.py loadgen/loadgen.py alert-sink/sink.py tools/check_power_of_ten.py tests
      - name: NASA/JPL Power of Ten checks
        run: python tools/check_power_of_ten.py

  test:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest (fails below 90% coverage)
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans the whole history
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit==2.10.1
      - name: pip-audit (known vulnerabilities in dependencies)
        run: pip-audit -r services/requirements.txt -r requirements-dev.txt
      - name: gitleaks (committed secrets)
        # Third-party action pinned to a full commit SHA: a tag can be moved to
        # malicious code, a SHA cannot. Dependabot updates the SHA.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  config:
    name: Validate configs, alerts, Dockerfiles, shell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: docker compose config --quiet
      - name: promtool check rules
        run: docker run --rm --entrypoint promtool -v "$PWD/prometheus:/p" "$PROMETHEUS_IMAGE" check rules /p/rules/slo-recording.yml /p/rules/alerts.yml
      - name: promtool check config
        run: docker run --rm --entrypoint promtool -v "$PWD/prometheus:/etc/prometheus" "$PROMETHEUS_IMAGE" check config --syntax-only /etc/prometheus/prometheus.yml
      - name: promtool test rules (alert unit tests)
        run: docker run --rm --entrypoint promtool -v "$PWD/prometheus:/p" "$PROMETHEUS_IMAGE" test rules /p/tests/alerts_test.yml
      - name: amtool check-config
        run: docker run --rm --entrypoint amtool -v "$PWD/alertmanager:/a" "$ALERTMANAGER_IMAGE" check-config /a/alertmanager.yml
      - name: otelcol validate
        run: docker run --rm -v "$PWD/otel-collector/config.yaml:/c.yaml:ro" "$OTELCOL_IMAGE" validate --config=/c.yaml
      - name: Grafana dashboards are valid JSON
        run: for f in grafana/dashboards/*.json; do python3 -m json.tool "$f" > /dev/null && echo "ok $f"; done
      - name: hadolint
        run: for f in services/Dockerfile loadgen/Dockerfile alert-sink/Dockerfile; do docker run --rm -i hadolint/hadolint < "$f" && echo "ok $f"; done
      - name: shellcheck
        run: shellcheck scripts/*.sh

  e2e:
    name: End-to-end smoke test (full stack)
    needs: [lint, test, config]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300 gateway orders payments otel-collector prometheus tempo loki grafana alertmanager alert-sink
      - name: Start traffic
        run: docker compose up --detach loadgen
      - name: Smoke test
        run: ./scripts/smoke_test.sh
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
