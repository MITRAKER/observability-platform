# CodeQL: GitHub's semantic code analysis. It finds security bugs such as
# injection or unsafe deserialization, and shows them in the Security tab.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"   # weekly, so new vulnerability queries run on old code too

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python, actions
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
