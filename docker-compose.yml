# Run everything with:  docker compose up --build
# The shop is then at http://localhost:8080 and Grafana at http://localhost:3000

# Settings shared by all three services (a YAML "anchor", reused below with <<).
# These OTEL_* variables are read by `opentelemetry-instrument`.
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_METRIC_EXPORT_INTERVAL: "5000"            # send metrics every 5 s
  OTEL_PYTHON_LOG_CORRELATION: "true"            # put trace_id in log records
  OTEL_PYTHON_LOG_LEVEL: info
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=shop,service.version=0.3.0

services:
  gateway:
    build:
      context: ./services
      args: { SERVICE: gateway }
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: gateway
      ORDERS_URL: http://orders:8000
    ports:
      - "8080:8000"   # only the gateway is reachable from your machine
    depends_on: [orders, otel-collector]

  orders:
    build:
      context: ./services
      args: { SERVICE: orders }
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: orders
      PAYMENTS_URL: http://payments:8000
    depends_on: [payments, otel-collector]

  payments:
    build:
      context: ./services
      args: { SERVICE: payments }
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: payments
      CHAOS_ERROR_RATE: "0.02"
      CHAOS_EXTRA_LATENCY_MS: "0"
    ports:
      - "8082:8000"   # exposed so you can flip chaos on from your machine
    depends_on: [otel-collector]

  # ---------------- Observability stack ----------------

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on: [tempo, loki]

  prometheus:
    image: prom/prometheus:v3.13.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver   # lets Tempo push metrics in
      - --enable-feature=exemplar-storage    # keeps trace ids on samples
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  tempo:
    image: grafana/tempo:2.10.4
    command: ["-config.file=/etc/tempo.yaml"]
    user: root   # the local storage volume must be writable
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  loki:
    image: grafana/loki:3.6.21
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:12.4.15
    environment:
      # Demo only: log in automatically as admin. Never do this in production.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus, tempo, loki]

  loadgen:
    build: ./loadgen
    environment:
      GATEWAY_URL: http://gateway:8000
      RPS: "5"
    depends_on: [gateway]

volumes:
  prometheus-data:
  tempo-data:
  loki-data:
