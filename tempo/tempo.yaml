# Tempo stores traces. This is the single-process ("monolithic") mode,
# good for a laptop. In production each component scales separately.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h      # keep traces for one day; it's a demo

# The metrics generator reads every span and produces Prometheus metrics:
#  - service-graphs: who calls whom, how often, how many errors
#    (this powers Grafana's "Service map")
#  - span-metrics: request rate, errors and duration for every span name
#  - local-blocks: lets Grafana run TraceQL metrics queries
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]
